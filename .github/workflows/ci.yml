name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Odin
      uses: laytan/setup-odin@v2
      with:
        release: dev-2026-07

    - name: Build Wren static library
      run: |
        chmod +x build_wren.sh
        ./build_wren.sh

    - name: Build and run full test suite
      run: |
        mkdir -p build

        # Build test runner
        odin build test_runner -out:build/test_runner

        # Run test runner (Wren's tests + our API tests)
        # NOTE: test_runner may segfault during cleanup (known stack alignment issue).
        # We capture output and verify tests passed before tolerating exit code 139.
        set +e
        test_output=$(./build/test_runner 2>&1)
        test_runner_exit=$?
        set -e

        # Check for test failures in output
        # NOTE: vendor/wren/test/language/string/literals.wren is a known Wren VM bug (see README)
        # Filter it out before checking for failures
        filtered_output=$(echo "$test_output" | grep -v "literals.wren")
        if echo "$filtered_output" | grep -q "✗\|FAIL\|failed"; then
          echo "Test failures detected:"
          echo "$filtered_output" | grep -E "✗|FAIL|failed" | head -20
          exit 1
        fi

        # If segfault (139), verify it's the known cleanup issue by checking tests completed
        if [ "$test_runner_exit" -eq 139 ]; then
          if echo "$test_output" | grep -q "Total:.*Passed:"; then
            echo "Tests completed successfully (segfault during cleanup is known issue)"
          else
            echo "Segfault occurred before tests completed:"
            echo "$test_output" | tail -30
            exit 1
          fi
        elif [ "$test_runner_exit" -ne 0 ]; then
          echo "test_runner failed with exit code: $test_runner_exit"
          echo "$test_output" | tail -30
          exit $test_runner_exit
        fi

        # Build and run integration tests
        odin build integration_tests/high_level_test.odin -file -out:build/high_level_test
        ./build/high_level_test

        odin build integration_tests/examples_test.odin -file -out:build/examples_test
        ./build/examples_test

    - name: Check Odin formatting
      run: |
        odin fmt -check wren/ || echo "Formatting issues found (non-blocking)"
